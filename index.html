<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3F5F8">
<title>MeCal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232446A8'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/><path d='M16 12v4l3 2' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#EAEEF3; --ink:#15213B; --ink-2:#3A465E; --muted:#697389;
  --line:#DCE1E9; --line-2:#E9EDF2; --hour:#E3E7EE; --quarter:#F1F3F7;
  --cobalt:#2446A8; --cobalt-soft:#E6ECFA; --turq:#0E8A8A; --coral:#D2483F; --coral-soft:#FBE9E7;
  --saffron:#C98A12; --leaf:#3E8A4E; --plum:#7B4397; --slate:#5E6B82;
  --ok:#2F8A57; --warn:#B7791F; --danger:#C0392B;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --lift:0 1px 0 rgba(21,33,59,.04), 0 18px 40px -24px rgba(21,33,59,.35);
  --font:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1320; --surface:#131C2C; --sunk:#0F1726; --ink:#E7ECF5; --ink-2:#C2CADA; --muted:#8B96AB;
    --line:#26324A; --line-2:#1D2839; --hour:#223049; --quarter:#18233A;
    --cobalt:#6F8EF0; --cobalt-soft:#1B2848; --turq:#34B3B0; --coral:#F06A5F; --coral-soft:#3A1F22;
    --saffron:#E3A93A; --leaf:#5DB36E; --plum:#B07DD0; --slate:#8C9AB3;
    --lift:0 1px 0 rgba(0,0,0,.2), 0 18px 40px -24px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1320; --surface:#131C2C; --sunk:#0F1726; --ink:#E7ECF5; --ink-2:#C2CADA; --muted:#8B96AB;
  --line:#26324A; --line-2:#1D2839; --hour:#223049; --quarter:#18233A;
  --cobalt:#6F8EF0; --cobalt-soft:#1B2848; --turq:#34B3B0; --coral:#F06A5F; --coral-soft:#3A1F22;
  --saffron:#E3A93A; --leaf:#5DB36E; --plum:#B07DD0; --slate:#8C9AB3;
  --lift:0 1px 0 rgba(0,0,0,.2), 0 18px 40px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- rail ---------- */
.rail{width:88px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;gap:4px;z-index:5}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.brand svg{width:34px;height:34px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.rail-btn{width:72px;padding:9px 0 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;font-weight:600;transition:background .15s,color .15s}
.rail-btn svg{width:21px;height:21px}
.rail-btn:hover{color:var(--ink);background:var(--sunk)}
.rail-btn.on{color:var(--cobalt);background:var(--cobalt-soft)}
.rail-sp{flex:1}
.rail-clock{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:8px}
.rail-pomo{display:none;margin-top:6px;font-size:12px;font-weight:700;color:var(--coral);background:var(--coral-soft);padding:3px 8px;border-radius:99px}
.rail-pomo.on{display:block}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:16px;padding:18px 28px 14px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.top-title{min-width:0;margin-right:auto}
.top-title h1{font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.top-title p{color:var(--muted);font-size:13px;margin-top:3px}
.top-nav{display:flex;align-items:center;gap:6px}
.top-act{display:flex;align-items:center;gap:8px}
.save-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-state.err i{background:var(--danger)}
.view{flex:1;overflow:auto;padding:22px 28px 40px}

/* ---------- buttons & inputs ---------- */
.btn{height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.tomato{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn svg{width:16px;height:16px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--ink-2)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.sm{width:28px;height:28px;border-radius:7px}
.inp,.sel,textarea.inp{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;min-width:0}
textarea.inp{height:auto;padding:8px 10px;resize:vertical}
.inp:focus,.sel:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.inp.sm,.sel.sm{height:28px;font-size:12.5px;border-radius:7px;padding:0 8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--cobalt)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-h h2{font-size:16px}
.panel-h .grow{flex:1}
.muted{color:var(--muted)}
.sub-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 0 6px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.notice{background:var(--cobalt-soft);border:1px solid color-mix(in srgb,var(--cobalt) 25%,transparent);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.notice p{flex:1;min-width:220px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:3px;background:var(--c,var(--slate));flex:none;display:inline-block}

/* ---------- today: ribbon ---------- */
.ribbon-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 22px 12px;margin-bottom:18px}
.rb-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.rb-now{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.rb-next{color:var(--ink-2);font-size:14px}
.rb-next b{color:var(--ink)}
.rb-score{margin-left:auto;text-align:right}
.rb-score strong{font-size:28px;font-weight:800;letter-spacing:-.03em}
.rb-score span{display:block;font-size:12px;color:var(--muted)}
.ribbon{--lane-h:22px;position:relative;padding-bottom:22px}
.rb-track{position:relative;height:calc(var(--lanes) * var(--lane-h) + 4px);background:
  repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px calc(100% / var(--hours)));border-radius:8px}
.seg{position:absolute;height:calc(var(--lane-h) - 4px);margin-top:2px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-left:3px solid var(--c);overflow:hidden;text-align:left;padding:0 5px;font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;min-width:6px}
.seg span{display:block;overflow:hidden;text-overflow:ellipsis;line-height:calc(var(--lane-h) - 6px)}
.seg.done{background:var(--c);color:#fff;border-color:var(--c)}
.seg.skip{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,var(--surface) 4px 8px);color:var(--muted);border-color:var(--line);border-left-color:var(--muted)}
.seg:hover{z-index:2;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--c)}
.rb-axis{position:absolute;left:0;right:0;bottom:0;height:18px}
.rb-axis span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--muted);top:4px}
.rb-needle{position:absolute;top:-6px;bottom:16px;width:2px;background:var(--coral);border-radius:2px;pointer-events:none}
.rb-needle::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.rb-past{position:absolute;top:0;left:0;height:calc(var(--lanes) * var(--lane-h) + 4px);background:color-mix(in srgb,var(--paper) 55%,transparent);pointer-events:none;border-radius:8px 0 0 8px}

/* ---------- today: grid ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:18px}
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:-2px 0 10px}
.progress i{display:block;height:100%;background:var(--turq);border-radius:99px;transition:width .3s}
.ag{list-style:none}
.ag-row{display:grid;grid-template-columns:30px 62px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line-2);border-radius:8px}
.ag-row:last-child{border-bottom:0}
.ag-row.is-now{background:color-mix(in srgb,var(--coral) 7%,transparent)}
.ag-row.is-now .ag-time b{color:var(--coral)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--c,var(--line));display:grid;place-items:center;color:transparent;background:var(--surface);transition:background .15s}
.chk svg{width:14px;height:14px}
.chk:hover{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.is-done .chk{background:var(--c);color:#fff}
.is-skip .chk{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.ag-time b{display:block;font-weight:700;font-size:13.5px}
.ag-time small{color:var(--muted);font-size:11.5px}
.ag-title{min-width:0}
.ag-title span{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-title em{font-style:normal;color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.is-done .ag-title span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--ink-2)}
.is-skip .ag-title span{color:var(--muted)}
.ag-act{display:flex;gap:4px;opacity:.55;transition:opacity .15s}
.ag-row:hover .ag-act,.ag-row:focus-within .ag-act{opacity:1}
.kind{font-size:10.5px;font-weight:700;color:var(--muted);padding:1px 6px;border:1px solid var(--line);border-radius:5px}

/* ---------- focus timer ---------- */
.focus{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;box-shadow:var(--lift);position:relative;overflow:hidden}
.focus::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--coral)}
.focus.m-short::before,.focus.m-long::before{background:var(--turq)}
.seg-switch{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg-switch button{flex:1;height:28px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.seg-switch button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ring-wrap{position:relative;width:196px;height:196px;margin:18px auto 12px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{stroke:var(--sunk)}
.ring-fg{stroke:var(--coral);transition:stroke-dashoffset .5s linear}
.m-short .ring-fg,.m-long .ring-fg{stroke:var(--turq)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ring-txt span{font-size:12px;color:var(--muted);margin-top:6px}
.focus-ctl{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.focus-ctl .btn.tomato{min-width:112px;justify-content:center}
.focus-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-2);padding-top:12px;margin-top:4px}
.focus-stats div{text-align:center}
.focus-stats b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.focus-stats span{font-size:11.5px;color:var(--muted)}
.rounds{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.rounds i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.rounds i.on{background:var(--coral)}

/* ---------- lists (tasks, goals) ---------- */
.tl{list-style:none}
.tl li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.tl li:last-child{border-bottom:0}
.tl .chk{width:20px;height:20px;border-radius:6px}
.tl .chk svg{width:12px;height:12px}
.tl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .is-done .t,.tl li.is-done .t{text-decoration:line-through;color:var(--muted)}
.add-line{display:flex;gap:6px;margin-top:10px}
.add-line .inp{flex:1}
.goal{padding:10px 0;border-bottom:1px solid var(--line-2)}
.goal:last-child{border-bottom:0}
.goal-top{display:flex;align-items:center;gap:8px}
.goal-top b{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-top small{color:var(--muted);font-size:12px;white-space:nowrap}
.gbar{height:8px;border-radius:99px;background:var(--sunk);margin-top:7px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--cobalt))}
.gbar.hit i{background:var(--ok)}

/* ---------- week ---------- */
.week-shell{display:grid;grid-template-columns:minmax(150px,var(--palw,220px)) 10px minmax(0,1fr);gap:11px;height:100%}
.wk-split{cursor:col-resize;position:relative;touch-action:none;user-select:none}
.wk-split::before{content:"";position:absolute;left:3px;right:3px;top:0;bottom:0;border-radius:4px;background:var(--line-2);transition:background .15s}
.wk-split:hover::before,.wk-split.on::before{background:var(--cobalt)}
.view.fill{padding-bottom:16px;display:flex;flex-direction:column}
.view.fill > *{flex:1;min-height:0}
.palette{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 12px;overflow:auto}
.palette h3{font-size:13px;margin-bottom:4px}
.palette p{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:grab;border:1px solid transparent;user-select:none}
.chip:hover{background:var(--sunk);border-color:var(--line)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.wk-row{display:grid;grid-template-columns:52px repeat(7,minmax(96px,1fr))}
.wk-head{border-bottom:1px solid var(--line)}
.wk-dh{padding:10px 8px 8px;border-left:1px solid var(--line-2);position:relative}
.wk-dh .dn{font-size:11.5px;font-weight:600;color:var(--muted)}
.wk-dh .dd{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1;display:flex;align-items:center;gap:6px}
.wk-dh.today .dd b{background:var(--cobalt);color:#fff;border-radius:8px;padding:0 6px}
.wk-dh .mini{height:4px;background:var(--sunk);border-radius:99px;margin-top:6px;overflow:hidden}
.wk-dh .mini i{display:block;height:100%;background:var(--turq)}
.wk-dh .dh-act{position:absolute;top:8px;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.wk-dh:hover .dh-act,.wk-dh:focus-within .dh-act{opacity:1}
.wk-un{border-bottom:1px solid var(--line)}
.wk-uc{border-left:1px solid var(--line-2);padding:5px;display:flex;flex-direction:column;gap:3px;min-height:34px}
.wk-uc .utag{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--sunk);border-radius:6px;padding:3px 6px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-uc .utag:hover{background:var(--line)}
.wk-scroll{flex:1;overflow:auto;min-height:0}
.wk-body{position:relative}
.wk-gut{position:relative;border-right:1px solid var(--line-2)}
.wk-gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:var(--muted)}
.wk-col{position:relative;border-left:1px solid var(--line-2);
  background-image:linear-gradient(var(--hour) 1px,transparent 1px),linear-gradient(var(--quarter) 1px,transparent 1px);
  background-size:100% var(--hp),100% calc(var(--hp) / 2)}
.wk-col.today{background-color:color-mix(in srgb,var(--cobalt) 4%,transparent)}
.wk-col.over{background-color:color-mix(in srgb,var(--cobalt) 9%,transparent)}
.drop-ind{position:absolute;left:2px;right:2px;height:2px;background:var(--cobalt);pointer-events:none;display:none;z-index:4}
.drop-ind::after{content:attr(data-t);position:absolute;left:0;top:-17px;font-size:10.5px;font-weight:700;color:#fff;background:var(--cobalt);padding:1px 5px;border-radius:4px}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--coral);z-index:3;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.blk{position:absolute;padding:2px 5px;border-radius:6px;font-size:11px;line-height:1.25;overflow:hidden;cursor:grab;
  background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-left:3px solid var(--c);color:var(--ink);text-align:left;z-index:1}
.blk:hover{z-index:2;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.blk .bt{font-weight:700;margin-right:4px;color:var(--ink-2)}
.blk .bn{font-weight:600}
.blk.done{background:var(--c);color:#fff;border-color:var(--c)}
.blk.done .bt{color:rgba(255,255,255,.85)}
.blk.skip{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,var(--surface) 4px 8px);color:var(--muted);border-left-color:var(--muted)}
.blk.task{border-style:dashed;border-left-style:solid}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize}
.blk.dragging{opacity:.4}

/* ---------- month ---------- */
.month-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.mh{padding:10px 10px 8px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.mc{min-height:118px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--turq) var(--heat,0%),var(--surface));transition:outline-color .15s}
.mc:nth-child(7n){border-right:0}
.mc:hover{outline:2px solid var(--cobalt);outline-offset:-2px}
.mc.out{opacity:.45}
.mc .md{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
.mc.today .md b{background:var(--cobalt);color:#fff;border-radius:7px;padding:0 6px}
.mc .mr{font-size:11px;font-weight:600;color:var(--ink-2)}
.mc .mp{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--surface);border-left:3px solid var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.mc .mp.done{text-decoration:line-through;color:var(--muted)}
.mc .mm{font-size:11px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

/* ---------- year ---------- */
.year-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ym{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;text-align:left;display:block}
.ym:hover{border-color:var(--cobalt)}
.ym-h{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.ym-h small{color:var(--muted);font-weight:600;font-size:12px}
.ydays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.yd{display:block}
.yd{aspect-ratio:1;border-radius:3px;background:var(--sunk);font-size:0}
.yd.l1{background:color-mix(in srgb,var(--turq) 25%,var(--surface))}
.yd.l2{background:color-mix(in srgb,var(--turq) 50%,var(--surface))}
.yd.l3{background:color-mix(in srgb,var(--turq) 75%,var(--surface))}
.yd.l4{background:var(--turq)}
.yd.fut{background:transparent;border:1px solid var(--line-2)}
.yd.tdy{outline:2px solid var(--cobalt);outline-offset:1px}
.yd.blank{background:transparent}

/* ---------- routines ---------- */
.rt-table{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:auto}
.rt-row{display:grid;grid-template-columns:26px minmax(180px,1.6fr) 150px 232px 92px 78px 110px 96px 70px;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-2);min-width:1120px}
.rt-row:last-child{border-bottom:0}
.rt-row.hd{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);padding-top:9px;padding-bottom:9px}
.rt-row.paused{opacity:.5}
.rt-row.drop{box-shadow:inset 0 2px 0 var(--cobalt)}
.handle{cursor:grab;color:var(--muted);display:grid;place-items:center}
.handle svg{width:14px;height:14px}
.rt-name{display:flex;align-items:center;gap:8px;min-width:0}
.rt-name button{font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-name button:hover{color:var(--cobalt)}
.days{display:flex;gap:3px}
.days button{width:29px;height:26px;border-radius:6px;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.days button.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.rate{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.rate .gbar{flex:1;margin:0;height:6px}
.streak{font-size:12px;font-weight:700}
.streak small{font-weight:500;color:var(--muted)}
.cat-list{display:flex;flex-wrap:wrap;gap:8px}
.cat-ed{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 8px;background:var(--surface)}
.cat-ed .inp{width:130px;border:0;height:26px;padding:0 4px}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:6px;background:var(--c);border:2px solid transparent}
.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}

/* ---------- plan ---------- */
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.plan-col h2{font-size:17px}
.plan-col .per{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- reports ---------- */
.rep-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:16px 18px}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .dlt{font-size:12px;font-weight:700;margin-left:6px}
.dlt.up{color:var(--ok)} .dlt.dn{color:var(--danger)}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart text.bv{fill:var(--ink);font-weight:700;font-size:10px}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.rtab td{padding:7px 8px;border-bottom:1px solid var(--line-2)}
.rtab td.n{text-align:right;font-weight:600;white-space:nowrap}
.rtab .gbar{margin:0;min-width:80px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:6px 0 10px}
.stack i{display:block;height:100%}
.report-text{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:var(--sunk);border-radius:10px;padding:14px 16px;border:1px solid var(--line-2)}
.arch{list-style:none}
.arch li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.arch li b{flex:1}

/* ---------- outlook & settings ---------- */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.steps{counter-reset:s;list-style:none;margin:10px 0 14px}
.steps li{counter-increment:s;position:relative;padding:0 0 10px 34px;color:var(--ink-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:22px;height:22px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);font-weight:800;font-size:12px;display:grid;place-items:center}
.steps li b{color:var(--ink)}
.tag-rec{font-size:11.5px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);padding:2px 8px;border-radius:99px}
.tag-opt{font-size:11.5px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 8px;border-radius:99px}
.log{font-size:12px;background:var(--sunk);border-radius:8px;padding:10px 12px;max-height:180px;overflow:auto;white-space:pre-wrap;margin-top:12px;color:var(--ink-2)}
.set-sec{margin-bottom:18px}
.set-sec h2{font-size:16px;margin-bottom:12px}
.kv{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
code{font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-position:center;background-size:cover}
.bg::after{content:"";position:absolute;inset:0;background:var(--paper);opacity:var(--bg-dim,0)}
body.has-bg .top{background:color-mix(in srgb,var(--paper) 72%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.has-bg .rail{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bg-opts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
.bg-sw{width:56px;height:40px;border-radius:9px;border:2px solid var(--line);background-size:cover;background-position:center;background-color:var(--paper);flex:none}
.bg-sw:hover{border-color:var(--ink-2)}
.bg-sw.on{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.bg-sw.add{display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600}
input[type=range].rng{accent-color:var(--cobalt);width:200px;max-width:100%}

/* ---------- routine slots ---------- */
.slot-row{display:flex;gap:6px;align-items:center}
.slot-row .sel{flex:1}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.miss{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.pill.run{color:var(--cobalt);background:var(--cobalt-soft)}

/* ---------- dialog & toast ---------- */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45);margin:auto}
dialog::backdrop{background:rgba(12,19,32,.45)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.dlg-h h3{font-size:18px;flex:1}
.dlg-b{padding:10px 20px 6px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 18px;flex-wrap:wrap}
.dlg-f .left{margin-right:auto;display:flex;gap:6px;flex-wrap:wrap}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.status-row .btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toasts{position:fixed;left:104px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast button{color:var(--surface);font-weight:700;text-decoration:underline}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
input[type=file]{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .today-grid,.month-shell,.year-shell{grid-template-columns:1fr}
  .plan-grid{grid-template-columns:1fr}
  .rep-grid,.two{grid-template-columns:1fr}
}
@media (max-width:820px){
  body{flex-direction:column-reverse}
  .rail{width:100%;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .brand,.rail-sp,.rail-clock{display:none}
  .rail{justify-content:flex-start}
  .rail-btn{width:auto;min-width:0;flex:1 0 42px;padding:6px 2px;font-size:9.5px;letter-spacing:-.01em}
  .main{height:auto;flex:1;min-height:0}
  .top{padding:14px 16px 10px}
  .top-title h1{font-size:21px}
  .top-nav{margin-left:0}
  .view{padding:16px 14px 30px}
  .week-shell{grid-template-columns:1fr}
  .wk-split{display:none}
  .wk-dh .dh-act{opacity:1}
  .wk{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .wk-head,.wk-un,.wk-scroll{min-width:680px}
  .wk-row{grid-template-columns:44px repeat(7,minmax(88px,1fr))}
  .palette{display:none}
  .rb-now{font-size:34px}
  .rb-axis span:nth-child(even){display:none}
  .toasts{left:16px;bottom:84px}
  .ag-row{grid-template-columns:28px 52px minmax(0,1fr)}
  .ag-act{grid-column:2 / -1;opacity:1}
}
</style>
</head>

      <path d="M17 29A12 12 0 0 1 5 17h12z" fill="#fff" opacity=".55"/>

  <button class="rail-btn" data-act="go" data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15M15 4.5v15"/></svg>Hafta</button>
  <button class="rail-btn" data-act="go" data-view="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9 9.5v10M15 9.5v10"/></svg>Ay</button>
  <button class="rail-btn" data-act="go" data-view="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" fill="currentColor"/></svg>Yıl</button>
  <button class="rail-btn" data-act="go" data-view="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1"/><path d="M17.8 3.5v3.6h-3.6M6.2 20.5v-3.6h3.6"/></svg>Rutinler</button>
  <button class="rail-btn" data-act="go" data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>Hedefler</button>
  <button class="rail-btn" data-act="go" data-view="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>Rapor</button>
  <button class="rail-btn" data-act="go" data-view="outlook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>Outlook</button>
  <div class="rail-sp"></div>
  <button class="rail-btn" data-act="go" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="18" r="2" fill="var(--surface)"/></svg>Ayarlar</button>
  <div class="rail-pomo" id="railPomo" title="Odak sayacı"></div>
  <div class="rail-clock" id="railClock">--:--</div>
</nav>

<div class="main">
  <header class="top">
    <div class="top-title"><h1 id="hTitle">Bugün</h1><p id="hSub"></p></div>
    <div class="top-nav" id="hNav">
      <button class="icon-btn" data-act="nav" data-dir="-1" aria-label="Önceki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn" data-act="nav" data-dir="0">Bugün</button>
      <button class="icon-btn" data-act="nav" data-dir="1" aria-label="Sonraki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>

    <div class="top-act">
      <span class="save-state" id="saveState"><i></i><span>Kaydedildi</span></span>
      <button class="btn pri" data-act="newTask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Görev</button>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm" onsubmit="return false">
  <div class="dlg-h"><h3 id="dlgTitle"></h3><button type="button" class="icon-btn sm" data-act="closeDlg" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-b" id="dlgBody"></div>
  <div class="dlg-f" id="dlgFoot"></div>
</form></dialog>
<div class="bg" id="bgLayer" aria-hidden="true"></div>

<input type="file" id="fileImport" accept=".json,application/json">
<input type="file" id="bgFile" accept="image/*">
<script>
/* MeCal v8 — rutin (günde çoklu saat), görev, hedef, odak sayacı, rapor, Outlook, arka planlar */
if (window.opener && window.opener !== window && /[#&?](code|error)=/.test(location.hash + location.search)) {
  document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">Microsoft oturumu tamamlanıyor…</p>';
  throw new Error('msal-popup-window');
}

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isoDow = d => (d.getDay() + 6) % 7 + 1;
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, 1 - isoDow(x)); };
const toMin = t => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };
const fromMin = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const todayStr = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const DOW = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
const DOW_L = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
const MON = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const COLORS = { cobalt:'#2446A8', turq:'#0E8A8A', coral:'#D2483F', saffron:'#C98A12', leaf:'#3E8A4E', plum:'#7B4397', slate:'#5E6B82', rose:'#C2477A', sky:'#2F86C9', olive:'#7A8A2E' };
const DURS = [5, 10, 15, 20, 30, 45, 60, 75, 90, 120, 150, 180];
const REMS = [[0,'Yok'],[5,'5 dk önce'],[10,'10 dk önce'],[15,'15 dk önce'],[30,'30 dk önce'],[60,'1 sa önce']];
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  skip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h11M12 7l5 5-5 5M19.5 6v12"/></svg>',

      const r = col.getBoundingClientRect();

      return clamp(Math.round((S.settings.dayStart * 60 + y / PPM) / 15) * 15, S.settings.dayStart * 60, S.settings.dayEnd * 60 - 15);
    };
    col.addEventListener('dragover', e => {
      if (!drag) return; e.preventDefault();
      const m = minAt(e);
      ind.style.display = 'block'; ind.style.top = (m - S.settings.dayStart * 60) * PPM + 'px'; ind.dataset.t = fromMin(m);
      col.classList.add('over');
    });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) { ind.style.display = 'none'; col.classList.remove('over'); } });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over'); ind.style.display = 'none';
      if (!drag) return;
      const time = fromMin(minAt(e)), ds = col.dataset.date;
      if (drag.type === 'palette') { addRoutineInstance(drag.rid, ds, time, null); toast(`${routine(drag.rid).title}: ${fmtDate(ds, false)} ${time} (yalnızca bu gün)`); }
      else { const it = itemFromKey(drag.k); if (it) moveItem(it, ds, time); }
      drag = null; commit();
    });
  });
}

/* ---------- plan: horizons & goals ---------- */
const H_NAME = { week: 'Bu hafta', month: 'Bu ay', year: 'Bu yıl' };
function goalsFor(h, pk) { return S.goals.filter(g => g.horizon === h && (g.recurring || g.period === pk)); }
/* Dönem anahtarından tarih aralığı: '2026-W38' → [pzt, paz] */
function periodFromKey(h, pk) {
  if (h === 'week') { const [y, w] = String(pk).split('-W').map(Number); const mon = addDays(mondayOf(new Date(y, 0, 4)), (w - 1) * 7); return [ymd(mon), ymd(addDays(mon, 6))]; }
  if (h === 'month') { const [y, m] = String(pk).split('-').map(Number); return [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))]; }
  return [`${pk}-01-01`, `${pk}-12-31`];
}
/* Verilen tarih aralığıyla kesişen hedefler (tekrarlılar aralığın son dönemine oturur) */
function goalsInRange(from, to) {
  return S.goals.map(g => {
    const pk = g.recurring ? periodKey(g.horizon, parseYmd(to)) : g.period;
    if (!pk) return null;
    const [a, b] = periodFromKey(g.horizon, pk);
    if (b < from || a > to) return null;
    return { g, pk, a, b, p: goalProgress(g, g.horizon, pk, a, b) };
  }).filter(Boolean);
}
function goalProgress(g, h, pk, from, to) {
  if (g.metric === 'focus') {
    const m = sessionsIn(from, to).filter(s => !g.catId || s.catId === g.catId).reduce((a, s) => a + s.mins, 0);
    const tgt = (g.target || 0) * 60;
    return { pct: tgt ? m / tgt : 0, label: `${fmtH(m)} / ${g.target} sa` };
  }
  if (g.metric === 'routine') {
    const st = g.routineId ? routineStats(from, to, g.routineId) : rangeStats(from, to);
    const r = st ? (g.routineId ? (st.plan ? st.done / st.plan : null) : st.rate) : null;
    return { pct: r == null ? 0 : r / ((g.target || 100) / 100), label: `${r == null ? '—' : '%' + Math.round(r * 100)} / %${g.target}` };
  }
  if (g.metric === 'tasks') {
    const n = tasksDoneIn(from, to).length;
    return { pct: g.target ? n / g.target : 0, label: `${n} / ${g.target} görev` };
  }
  const n = g.counts[pk] || 0;
  return { pct: g.target ? n / g.target : 0, label: `${n} / ${g.target}`, counter: true };
}
function horizonBlock(h, compact) {
  const pk = periodKey(h, cur);
  const [from, to] = periodRange(h, cur);
  const lb = periodLabel(h, cur);
  const goals = goalsFor(h, pk);
  const tasks = S.tasks.filter(t => t.scope === h && t.period === pk).sort((a, b) => a.done - b.done);
  const g = goals.map(x => {
    const p = goalProgress(x, h, pk, from, to);
    const c = x.catId ? cat(x.catId).color : 'var(--cobalt)';
    return `<div class="goal"><div class="goal-top"><b title="${esc(x.title)}">${esc(x.title)}</b><small>${p.label}</small>
      ${p.counter ? `<button class="icon-btn sm" data-act="goalCount" data-gid="${x.id}" data-pk="${pk}" data-d="-1" aria-label="Azalt">${ICON.minus}</button><button class="icon-btn sm" data-act="goalCount" data-gid="${x.id}" data-pk="${pk}" data-d="1" aria-label="Artır">${ICON.plus}</button>` : ''}
      <button class="icon-btn sm" data-act="editGoal" data-gid="${x.id}" aria-label="Düzenle">${ICON.more}</button></div>
      <div class="gbar ${p.pct >= 1 ? 'hit' : ''}"><i style="width:${Math.min(100, p.pct * 100)}%;--c:${c}"></i></div></div>`;

  const tl = tasks.map(t => `<li class="${t.done ? 'is-done' : ''}" style="--c:${cat(t.catId).color}">
    <button class="chk" data-act="htDone" data-tid="${t.id}" aria-label="Tamamlandı">${ICON.check}</button>

    <button class="icon-btn sm" data-act="editTask" data-tid="${t.id}" aria-label="Düzenle">${ICON.more}</button></li>`).join('');
  return `<div class="plan-col">
    <div class="panel-h"><div class="grow"><h2>${compact ? H_NAME[h] : lb.t}</h2><div class="per">${compact ? lb.t + ', ' + lb.s : lb.s}</div></div>
      <button class="btn sm ghost" data-act="editGoal" data-h="${h}">Hedef</button></div>
    ${goals.length ? `<h3 class="sub-h" style="margin-top:4px">Hedefler</h3>${g}` : compact ? '' : `<p class="muted" style="font-size:12.5px">Bu dönem için hedef yok.</p>`}
    <h3 class="sub-h">Görevler</h3>
    <ul class="tl">${tl || `<li class="muted" style="border:0">${H_NAME[h]} için görev yok.</li>`}</ul>
    <div class="add-line"><input class="inp sm" placeholder="${H_NAME[h]} yapılacak…" data-enter="addHTask" data-h="${h}" data-pk="${pk}"><button class="btn sm" data-act="addHTask" data-h="${h}" data-pk="${pk}">Ekle</button></div>
  </div>`;
}

/* ---------- reports ---------- */
function repRange() {
  const u = S.ui, n = new Date();
  const m = mondayOf(n);
  switch (u.repRange) {
    case 'lastWeek': return [ymd(addDays(m, -7)), ymd(addDays(m, -1)), 'Geçen hafta'];
    case 'thisMonth': return [...periodRange('month', n), 'Bu ay'];
    case 'lastMonth': { const d = new Date(n.getFullYear(), n.getMonth() - 1, 1); return [...periodRange('month', d), 'Geçen ay']; }
    case 'last90': return [ymd(addDays(n, -89)), ymd(n), 'Son 90 gün'];
    case 'thisYear': return [...periodRange('year', n), 'Bu yıl'];
    case 'custom': return [u.repFrom || ymd(addDays(n, -6)), u.repTo || ymd(n), 'Özel aralık'];
    default: return [ymd(m), ymd(addDays(m, 6)), 'Bu hafta'];
  }
}
function metrics(from, to) {
  const end = to > todayStr() ? todayStr() : to;
  const rs = rangeStats(from, to);
  const ses = sessionsIn(from, to);
  const focus = ses.reduce((a, s) => a + s.mins, 0);
  const tdone = tasksDoneIn(from, to).length;
  const topen = S.tasks.filter(t => !t.done && t.scope === 'day' && t.date >= from && t.date <= end).length;
  const days = from <= end ? rangeDates(from, end) : [];
  const perDay = days.map(ds => { const s = dayStats(ds); return { ds, rate: s.total ? s.done / s.total : null, focus: ses.filter(x => x.date === ds).reduce((a, x) => a + x.mins, 0) }; });
  const wd = Array.from({ length: 7 }, () => ({ t: 0, d: 0 }));
  days.forEach(ds => { const s = dayStats(ds); const w = wd[isoDow(parseYmd(ds)) - 1]; w.t += s.total; w.d += s.done; });
  const byCat = {};
  ses.forEach(s => { const k = s.catId || 'none'; byCat[k] = (byCat[k] || 0) + s.mins; });
  const perR = routineStats(from, to).map(x => ({ ...x, rate: x.done / x.plan })).sort((a, b) => b.rate - a.rate || b.plan - a.plan);
  const planMin = perR.reduce((a, x) => a + x.planMin, 0), doneMin = perR.reduce((a, x) => a + x.doneMin, 0);
  const active = perDay.filter(d => d.rate != null && d.rate > 0).length;
  const perfect = perDay.filter(d => d.rate === 1).length;
  const byTitle = {};
  ses.forEach(s => { byTitle[s.title || '—'] = (byTitle[s.title || '—'] || 0) + s.mins; });
  const topFocus = Object.entries(byTitle).sort((a, b) => b[1] - a[1])[0] || null;
  return { rs, focus, sessions: ses.length, tdone, topen, perDay, wd, byCat, perR, days: days.length, planMin, doneMin, active, perfect, topFocus };
}
function barChart(data, { h = 140, max = null, fmt = v => v, color = 'var(--turq)', labels = [] }) {
  const W = 600, pad = 24, n = data.length || 1;
  const mx = max ?? Math.max(1, ...data.map(v => v || 0));
  const bw = (W - pad) / n;
  let bars = '';
  data.forEach((v, i) => {
    const bh = v == null ? 0 : (v / mx) * (h - 34);
    const w = Math.min(bw * .7, 56), x = pad + i * bw + (bw - w) / 2;
    bars += `<rect x="${x}" y="${h - 16 - bh}" width="${Math.max(1, w)}" height="${Math.max(v ? 1.5 : 0, bh)}" rx="3" fill="${v == null ? 'var(--sunk)' : color}"><title>${labels[i] || ''}: ${v == null ? '—' : fmt(v)}</title></rect>`;
    if (n <= 16 && v) bars += `<text class="bv" x="${pad + i * bw + bw / 2}" y="${h - 20 - bh}" text-anchor="middle">${fmt(v)}</text>`;

function autoReport() {

  const n = new Date(); let from, to, label, key;
  if (f === 'weekly') { const m = mondayOf(n); from = ymd(addDays(m, -7)); to = ymd(addDays(m, -1)); key = 'W:' + from; label = `Hafta ${isoWeek(parseYmd(from)).w} özeti`; }
  else { const d = new Date(n.getFullYear(), n.getMonth() - 1, 1); [from, to] = periodRange('month', d); key = 'M:' + from; label = `${MON[d.getMonth()]} ${d.getFullYear()} özeti`; }
  if (S.reports.some(r => r.key === key)) return;
  if (to < S.meta.createdAt.slice(0, 10)) return;
  S.reports.unshift({ id: uid('rep'), key, label, from, to, createdAt: new Date().toISOString(), text: buildReport(from, to, label.toLowerCase()) });

/* ---------- ICS ---------- */
const BYDAY = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];

function fold(line) {

}
const icsDT = (ds, t) => ds.replace(/-/g, '') + 'T' + t.replace(':', '') + '00';
const icsD = ds => ds.replace(/-/g, '');
const utcStamp = () => new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');

}
function openEndPause(r, afterDs) { const p = r.paused.filter(p => !p.to && p.from > afterDs).sort((a, b) => a.from.localeCompare(b.from))[0]; return p ? ymd(addDays(parseYmd(p.from), -1)) : null; }

function vevent({ uid: u, ds, time, dur, title, note, catName, reminder, rrule, exdates }) {

function routineEvents(onlyTimed) {
  const t = todayStr();
  const out = [];
  S.routines.filter(r => r.days.length).forEach(r => {
    const first = firstOccurrence(r, t); if (!first) return;
    const until = openEndPause(r, first) || r.end;
    const base = `FREQ=WEEKLY;WKST=MO;BYDAY=${[...r.days].sort().map(d => BYDAY[d - 1]).join(',')}`;
    const pauseEx = [];
    r.paused.filter(p => p.to && p.to >= first).forEach(p => rangeDates(p.from > first ? p.from : first, p.to).forEach(ds => { if (r.days.includes(isoDow(parseYmd(ds)))) pauseEx.push(ds); }));
    r.slots.forEach(sl => {
      if (onlyTimed && !sl.time) return;
      const iid = r.id + '.' + sl.id;
      let rule = base;
      if (until) rule += sl.time ? `;UNTIL=${icsD(until)}T205959Z` : `;UNTIL=${icsD(until)}`;
      const ex = Object.keys(S.overrides).filter(ds => ds >= first && (!until || ds <= until) && S.overrides[ds][iid] && isScheduled(r, ds)
        && (S.overrides[ds][iid].removed || S.overrides[ds][iid].time || S.overrides[ds][iid].dur)).sort();
      out.push(vevent({ uid: `mecal-routine-${r.id}-${sl.id}@mecal.local`, ds: first, time: sl.time, dur: sl.dur, title: r.title, note: r.note, catName: cat(r.catId).name, reminder: r.reminder, rrule: rule, exdates: [...new Set([...ex, ...pauseEx])].sort() }));

  });

}

      const r = rtOf(i.id);
      ev.push(vevent({ uid: `mecal-inst-${i.id}-${ds}@mecal.local`, ds, time: i.time, dur: i.dur, title: i.title, note: i.note, catName: cat(i.catId).name, reminder: r ? r.reminder : S.settings.reminder }));
    });
    S.tasks.filter(t => t.scope === 'day' && t.date === ds).forEach(t => {
      ev.push(vevent({ uid: `mecal-task-${t.id}@mecal.local`, ds, time: t.time, dur: t.dur || 30, title: t.title, note: t.note, catName: cat(t.catId).name, reminder: t.reminder ?? S.settings.reminder }));

function download(name, content, type) {

function deeplink(it) {

  return c.id;
}
const gTimeObj = (ds, t) => ({ dateTime: `${ds}T${t}:00`, timeZone: TZW });
function gEventBody({ ds, time, dur, title, note, catName, reminder }) {
  const allDay = !time;
  const b = { subject: title, body: { contentType: 'text', content: [note, catName ? `Kategori: ${catName}` : '', 'MeCal'].filter(Boolean).join('\n') },
    isAllDay: allDay, showAs: S.settings.busyFree ? 'free' : 'busy', isReminderOn: !allDay && reminder > 0, reminderMinutesBeforeStart: reminder || 0 };
  if (allDay) { b.start = gTimeObj(ds, '00:00'); b.end = gTimeObj(ymd(addDays(parseYmd(ds), 1)), '00:00'); }
  else { const [ed, et] = endOf(ds, time, dur); b.start = gTimeObj(ds, time); b.end = gTimeObj(ed, et); }
  return b;
}
async function gUpsert(key, body, cal) {
  const id = S.graph.map[key];
  if (id) {
    try { await gFetch('/me/events/' + id, { method: 'PATCH', body }); return 'u'; }
    catch (e) { if (e.status !== 404) throw e; }
  }
  const ev = await gFetch(`/me/calendars/${cal}/events`, { method: 'POST', body });
  S.graph.map[key] = ev.id; persist(); return 'c';
}
async function gDelete(key) {
  const id = S.graph.map[key]; if (!id) return;
  try { await gFetch('/me/events/' + id, { method: 'DELETE' }); } catch (e) { if (e.status !== 404) throw e; }
  delete S.graph.map[key]; persist();
}
async function gSyncRoutines() {
  const cal = await gCalendar(); const t = todayStr();
  const n = { c: 0, u: 0, d: 0 };
  for (const r of S.routines) {
    for (const sl of r.slots) {
      const key = 'r:' + r.id + '.' + sl.id;
      const first = r.days.length && (sl.time || S.ui.icsUntimed) ? firstOccurrence(r, t) : null;
      if (!first) { if (S.graph.map[key]) { await gDelete(key); n.d++; } continue; }
      const until = openEndPause(r, first) || r.end;
      const body = gEventBody({ ds: first, time: sl.time, dur: sl.dur, title: r.title, note: r.note, catName: cat(r.catId).name, reminder: r.reminder });
      body.recurrence = { pattern: { type: 'weekly', interval: 1, daysOfWeek: [...r.days].sort().map(d => GDAYS[d - 1]), firstDayOfWeek: 'monday' },
        range: until ? { type: 'endDate', startDate: first, endDate: until } : { type: 'noEnd', startDate: first } };
      n[await gUpsert(key, body, cal)]++;
    }
    glog(`${r.title}: tamam`);
  }
  for (const k of Object.keys(S.graph.map)) if (k.startsWith('r:') && !slotOf(k.slice(2))) { await gDelete(k); n.d++; }
  return n;
}
async function gSyncTasks(from, to) {
  const cal = await gCalendar();
  const n = { c: 0, u: 0, d: 0 };
  for (const ds of rangeDates(from, to)) {
    for (const t of S.tasks.filter(x => x.scope === 'day' && x.date === ds)) {
      n[await gUpsert('t:' + t.id, gEventBody({ ds, time: t.time, dur: t.dur || 30, title: t.title, note: t.note, catName: cat(t.catId).name, reminder: t.reminder ?? S.settings.reminder }), cal)]++;
    }
    for (const i of routinesFor(ds)) {
      const o = ov(ds, i.id); if (!(o.added || o.time || o.dur) || !i.time) continue;
      const r = rtOf(i.id);
      n[await gUpsert(`i:${i.id}:${ds}`, gEventBody({ ds, time: i.time, dur: i.dur, title: i.title, note: i.note, catName: cat(i.catId).name, reminder: r ? r.reminder : S.settings.reminder }), cal)]++;
    }
  }
  for (const k of Object.keys(S.graph.map)) {
    if (k.startsWith('t:')) { const t = task(k.slice(2)); if (!t || t.scope !== 'day') { await gDelete(k); n.d++; } }
    if (k.startsWith('i:')) { const [, iid, ds] = k.split(':'); const o = ov(ds, iid); if (!rtOf(iid) || !(o.added || o.time || o.dur)) { await gDelete(k); n.d++; } }
  }
  return n;
}
async function gRun(label, fn) {
  const btns = $$('[data-graph]'); btns.forEach(b => b.disabled = true);
  glog(label + '…');
  try { const n = await fn(); glog(`Bitti: ${n ? `${n.c} yeni, ${n.u} güncellendi, ${n.d} silindi` : 'tamam'}`); toast(label + ' tamamlandı.'); }
  catch (e) { glog('Hata: ' + e.message); toast('Outlook: ' + e.message); }
  finally { btns.forEach(b => b.disabled = false); persist(); }
}

/* ---------- file backup (File System Access) ---------- */
let backupHandle = null, backupNeedsPerm = false;
const idb = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('mecal', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  return {
    get: k => db().then(d => new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })),
    set: (k, v) => db().then(d => new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }))
  };
})();
async function initBackup() {
  try { backupHandle = await idb.get('backupHandle') || null; if (backupHandle) backupNeedsPerm = (await backupHandle.queryPermission({ mode: 'readwrite' })) !== 'granted'; } catch (e) { backupHandle = null; }
}
async function writeBackup() {
  if (!backupHandle || backupNeedsPerm) return;
  try {
    if ((await backupHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') { backupNeedsPerm = true; return; }
    const w = await backupHandle.createWritable(); await w.write(JSON.stringify(S, null, 1)); await w.close();
  } catch (e) { console.warn('backup', e); }
}

  repFrom: el => { S.ui.repFrom = el.value; commit(); },
  repTo: el => { S.ui.repTo = el.value; commit(); },
  setReport: el => { S.settings.report = el.value; persist(); autoReport(); render(); },
  icsUntimed: el => { S.ui.icsUntimed = el.checked; persist(); },
  busyFree: el => { S.settings.busyFree = el.checked; persist(); },
  clientId: el => { S.settings.clientId = el.value.trim(); G.app = null; G.account = null; persist(); },
  calName: el => { S.settings.calendarName = el.value.trim() || 'MeCal'; persist(); },
  dayStart: el => { S.settings.dayStart = Number(el.value); weekScroll = null; commit(); },
  dayEnd: el => { S.settings.dayEnd = Number(el.value); commit(); },
  theme: el => { S.settings.theme = el.value; commit(); },
  reminder: el => { S.settings.reminder = Number(el.value); persist(); },
  pFocus: el => { S.settings.focus = clamp(Number(el.value) || 25, 5, 120); persist(); paintPomo(); },
  pShort: el => { S.settings.short = clamp(Number(el.value) || 5, 1, 30); persist(); },
  pLong: el => { S.settings.long = clamp(Number(el.value) || 15, 5, 60); persist(); },
  pEvery: el => { S.settings.every = clamp(Number(el.value) || 4, 2, 8); persist(); },
  autoBreak: el => { S.settings.autoBreak = el.checked; persist(); },
  sound: el => { S.settings.sound = el.checked; persist(); if (el.checked) beep(); },
  goalMetric: () => goalFieldVis()
};
/* ---------- background engine ---------- */
const BG_COLORS = ['#2446A8', '#0E8A8A', '#3E8A4E', '#C98A12', '#7B4397', '#C2477A', '#2F86C9', '#5E6B82'];
const isDark = () => { const t = document.documentElement.getAttribute('data-theme'); return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); };
const svgUri = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
function patternCss(name) {
  const c = isDark() ? 'rgba(186,202,236,.085)' : 'rgba(21,33,59,.065)';
  const c2 = isDark() ? 'rgba(186,202,236,.055)' : 'rgba(21,33,59,.045)';
  switch (name) {
    case 'grid': return { image: `linear-gradient(${c2} 1px,transparent 1px),linear-gradient(90deg,${c2} 1px,transparent 1px)`, size: '26px 26px' };
    case 'diag': return { image: `repeating-linear-gradient(45deg,${c2} 0 1px,transparent 1px 15px)`, size: 'auto' };
    case 'cross': return { image: `radial-gradient(circle,transparent 8px,transparent 8px),linear-gradient(${c} 1.4px,transparent 1.4px),linear-gradient(90deg,${c} 1.4px,transparent 1.4px)`, size: '30px 30px', pos: '0 0,14.3px 10px,10px 14.3px' };
    default: return { image: `radial-gradient(${c} 1.2px,transparent 1.2px)`, size: '22px 22px' };
  }
}
function motifSvg(name) {
  const c = isDark() ? '#93a5cc' : '#43506b';
  const o = isDark() ? .12 : .10;
  const g = `fill='none' stroke='${c}' stroke-opacity='${o}' stroke-width='1.3'`;
  if (name === 'wave') return `<svg xmlns='http://www.w3.org/2000/svg' width='56' height='30' viewBox='0 0 56 30'><g ${g}><path d='M0 10 Q14 0 28 10 T56 10'/><path d='M0 24 Q14 14 28 24 T56 24'/></g></svg>`;
  if (name === 'leaf') return `<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g ${g}><path d='M12 40c0-11 9-20 20-20 0 11-9 20-20 20z'/><path d='M14 38L30 22'/><path d='M52 24c0 8-6.5 14.5-14.5 14.5C37.5 30.5 44 24 52 24z' transform='rotate(180 44.75 31.25)'/></g></svg>`;
  return `<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g ${g}><g transform='translate(36 36)'><rect x='-16' y='-16' width='32' height='32'/><rect x='-16' y='-16' width='32' height='32' transform='rotate(45)'/></g><circle cx='0' cy='0' r='5'/><circle cx='72' cy='0' r='5'/><circle cx='0' cy='72' r='5'/><circle cx='72' cy='72' r='5'/></g></svg>`;
}
function sceneSvg(name) {
  const W = `xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' preserveAspectRatio='xMidYMid slice'`;
  if (name === 'sea') return `<svg ${W}><defs><linearGradient id='a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1c3a63'/><stop offset='.5' stop-color='#e0784f'/><stop offset='.62' stop-color='#f5b06a'/><stop offset='.63' stop-color='#173d59'/><stop offset='1' stop-color='#0c2138'/></linearGradient></defs><rect width='1600' height='900' fill='url(#a)'/><circle cx='800' cy='545' r='62' fill='#ffe6b0' opacity='.95'/><g stroke='#ffd9a0' stroke-width='3' opacity='.45'><path d='M300 620h1000M420 660h760M540 700h520M640 745h320'/></g></svg>`;
  if (name === 'night') return `<svg ${W}><defs><linearGradient id='a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#080f26'/><stop offset='.7' stop-color='#152246'/><stop offset='1' stop-color='#233458'/></linearGradient></defs><rect width='1600' height='900' fill='url(#a)'/><g fill='#dfe8ff'><circle cx='180' cy='120' r='1.7'/><circle cx='420' cy='80' r='1.2'/><circle cx='640' cy='190' r='1.9'/><circle cx='900' cy='90' r='1.3'/><circle cx='1150' cy='170' r='1.8'/><circle cx='1380' cy='110' r='1.2'/><circle cx='300' cy='300' r='1.4'/><circle cx='760' cy='330' r='1.1'/><circle cx='1240' cy='320' r='1.5'/><circle cx='520' cy='420' r='1.2'/><circle cx='1460' cy='260' r='1.6'/><circle cx='90' cy='420' r='1.3'/></g><circle cx='1230' cy='210' r='58' fill='#f2ecd8' opacity='.92'/><circle cx='1208' cy='196' r='52' fill='#152246'/><path d='M0 700 L260 560 470 660 700 540 950 680 1180 590 1400 690 1600 620 V900 H0 Z' fill='#0b1330'/><path d='M0 790 L320 670 620 770 930 660 1250 780 1600 700 V900 H0 Z' fill='#060b1e'/></svg>`;
  if (name === 'mist') return `<svg ${W}><defs><linearGradient id='a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#dfe9e2'/><stop offset='1' stop-color='#aac4b2'/></linearGradient></defs><rect width='1600' height='900' fill='url(#a)'/><path d='M0 560 C300 480 520 640 820 560 1120 480 1360 620 1600 540 V900 H0 Z' fill='#7fa28c' opacity='.6'/><path d='M0 660 C280 590 560 730 880 650 1200 570 1420 700 1600 640 V900 H0 Z' fill='#5c8571' opacity='.75'/><path d='M0 770 C320 700 640 820 980 750 1280 690 1460 780 1600 740 V900 H0 Z' fill='#3c5f4d'/><rect width='1600' height='900' fill='#eef4ef' opacity='.14'/></svg>`;
  return `<svg ${W}><defs><linearGradient id='a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1b2a5e'/><stop offset='.45' stop-color='#5a4a8a'/><stop offset='.72' stop-color='#c96f6a'/><stop offset='1' stop-color='#f2c894'/></linearGradient></defs><rect width='1600' height='900' fill='url(#a)'/><circle cx='800' cy='640' r='68' fill='#ffdba8' opacity='.9'/><path d='M0 700 L220 560 380 660 560 540 760 680 940 590 1140 700 1330 610 1600 690 V900 H0 Z' fill='#1d2440' opacity='.88'/><path d='M0 780 L260 660 480 760 720 650 980 770 1240 680 1600 760 V900 H0 Z' fill='#141a30'/></svg>`;
}
function applyBg() {
  const el = $('#bgLayer'); if (!el) return;
  const bg = S.settings.bg || { type: 'plain' };
  const on = bg.type && bg.type !== 'plain';
  document.body.classList.toggle('has-bg', on);
  el.style.setProperty('--bg-dim', String(clamp(Number(bg.dim) || 0, 0, 90) / 100));
  el.style.backgroundImage = ''; el.style.backgroundColor = ''; el.style.backgroundSize = ''; el.style.backgroundRepeat = ''; el.style.backgroundPosition = '';
  if (!on) return;
  if (bg.type === 'color') el.style.backgroundColor = `color-mix(in srgb, ${bg.value || BG_COLORS[0]} ${isDark() ? 26 : 18}%, var(--paper))`;
  else if (bg.type === 'pattern') { const p = patternCss(bg.value); el.style.backgroundImage = p.image; el.style.backgroundSize = p.size; if (p.pos) el.style.backgroundPosition = p.pos; el.style.backgroundRepeat = 'repeat'; }
  else if (bg.type === 'motif') { el.style.backgroundImage = svgUri(motifSvg(bg.value)); el.style.backgroundSize = 'auto'; el.style.backgroundRepeat = 'repeat'; }
  else if (bg.type === 'image') {
    if (bg.value === 'custom') { let d = null; try { d = localStorage.getItem('mecal_bg_img'); } catch (e) {} el.style.backgroundImage = d ? `url("${d}")` : 'none'; }
    else el.style.backgroundImage = svgUri(sceneSvg(bg.value || 'dawn'));
    el.style.backgroundSize = 'cover'; el.style.backgroundRepeat = 'no-repeat';
  }
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
  $('meta[name=theme-color]').setAttribute('content', bg);
  applyBg();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S) applyTheme(); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = A[b.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(b, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el); });
document.addEventListener('keydown', e => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); A[e.target.dataset.enter](e.target.nextElementSibling); return; }
  if (inField || dlg().open || e.metaKey || e.ctrlKey || e.altKey) return;
  const order = ['today', 'week', 'month', 'year', 'routines', 'plan', 'reports', 'outlook'];
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openTaskDialog({}); }
  else if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); pomoRunning() ? pomoPause() : pomoStart(); }
  else if (e.key === 'ArrowLeft' && $('#hNav').style.display !== 'none') navStep(-1);
  else if (e.key === 'ArrowRight' && $('#hNav').style.display !== 'none') navStep(1);
  else if (e.key === 't' || e.key === 'T') navStep(0);
  else if (/^[1-8]$/.test(e.key)) go(order[Number(e.key) - 1]);
});
$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  if (dlgSubmit) { const r = dlgSubmit(); if (r === false) return; }
  closeDialog(); commit();
});
$('#fileImport').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (o.templates && (o.schedule || o.dailyPlan)) {
        if (!confirm('Eski MeCal yedeği bulundu. Rutinler bu dosyadan yeniden oluşturulsun mu? Mevcut rutin listesi değişir; görevler, kayıtlar ve raporlar korunur.')) return;
        const n = migrateV6(o); commit(); toast(`${n.routines} rutin ve ${n.tasks} görev aktarıldı. Günleri ve saatleri Rutinler sayfasında kontrol et.`); go('routines');
      } else if (Number(o.v) >= 7 && Array.isArray(o.routines)) {
        if (!confirm('Bu yedek mevcut tüm verinin yerine geçsin mi?')) return;
        S = normalize(o); commit(); toast('Yedek geri yüklendi.');
      } else toast('Dosya tanınmadı: MeCal yedeği değil.');
    } catch (err) { toast('Dosya okunamadı: ' + err.message); }
  };
  rd.readAsText(f); e.target.value = '';
});
$('#bgFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    const MX = 1920, k = Math.min(1, MX / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let q = .82, data = cv.toDataURL('image/jpeg', q);
    while (data.length > 2.6e6 && q > .4) { q -= .12; data = cv.toDataURL('image/jpeg', q); }
    try { localStorage.setItem('mecal_bg_img', data); }
    catch (err) { toast('Görsel kaydedilemedi: depolama dolu. Daha küçük bir görsel dene.'); return; }
    S.settings.bg = { type: 'image', value: 'custom', dim: S.settings.bg.dim ?? 30 };
    commit(); toast('Arka plan görselin ayarlandı.');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Görsel açılamadı.'); };
  img.src = url;
});
dlg().addEventListener('close', () => { dlgSubmit = null; });
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { S = normalize(JSON.parse(e.newValue)); render(); } catch (err) {} } });

let lastMin = -1, lastDay = todayStr();
function tick() {
  const now = new Date();
  $('#railClock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (S.pomo.endsAt && Date.now() >= S.pomo.endsAt) pomoFinish(true);
  else paintPomo();
  const m = now.getHours() * 60 + now.getMinutes();
  if (m !== lastMin) {
    lastMin = m;
    if (todayStr() !== lastDay) { lastDay = todayStr(); autoReport(); render(); return; }
    const st = S.settings.dayStart * 60, span = S.settings.dayEnd * 60 - st;
    const nd = $('#rbNeedle'), ps = $('#rbPast'), rn = $('#rbNow'), wl = $('#wkNow');
    if (nd) nd.style.left = (m - st) / span * 100 + '%';
    if (ps) ps.style.width = (m - st) / span * 100 + '%';
    if (rn && ymd(cur) === todayStr()) rn.textContent = fromMin(m);
    if (wl) wl.style.top = (m - st) * PPM + 'px';
  }
}

(async function init() {
  load();
  await initBackup();
  render();
  autoReport();
  tick(); setInterval(tick, 1000);
})();
</script>
